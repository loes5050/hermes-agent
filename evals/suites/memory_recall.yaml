# Memory Recall Suite — Cross-session memory retrieval quality
#
# Tests that the agent:
#   1. Retrieves a fact stored in a prior session (M1)
#   2. Surfaces the one relevant memory among many distractors (M2)
#   3. Respects a newer correction over a stale older fact (M3)
#   4. Stays honest on a clean HERMES_HOME — no hallucinated recall (M4)
#
# Pass condition: recall@3 ≥ 0.85 (see CONTRACT.md pass_conditions.type: recall_at_3)
#
# Memory model (from tools/memory_tool.py + agent/memory_manager.py):
#   - Builtin store: $HERMES_HOME/memories/MEMORY.md (agent notes)
#                   $HERMES_HOME/memories/USER.md   (user profile)
#   - Entries are §-delimited; loaded as a frozen snapshot into the system prompt
#     at session start (skip_memory=false enables this).
#   - The `memory` tool writes durable entries (action: add/replace/remove,
#     target: memory/user).
#   - MemoryManager.prefetch_all() injects recalled context into the user message
#     for external providers; the builtin snapshot is always in the system prompt.
#
# Deterministic seeding:
#   Scenarios that need pre-seeded state declare a `seed_memories` block.  A
#   test harness (or the runner's seeding hook) writes these entries to a temp
#   HERMES_HOME/memories/MEMORY.md before creating the AIAgent so the frozen
#   snapshot at load_from_disk() contains the known facts.  The rubric cross-
#   references `expected_recall` against result['final_response'] to compute
#   recall@3 without depending on live model determinism.

name: memory_recall
description: >
  Cross-session memory retrieval quality: fact recall, distractor resistance,
  stale-override resolution, and clean-state honesty.  Measures recall@3 ≥ 0.85.

scenarios:
  # ─────────────────────────────────────────────────────────────────────
  # M1 — Cross-session fact retrieval
  # A fact is stored via the memory tool in "session A" (turn 1), then the
  # agent is asked to retrieve it in "session B" (turn 2).  The frozen
  # snapshot from the first write is on disk; the second turn's system prompt
  # carries it.  The response must include the fact, giving recall@3 = 1.0.
  # ─────────────────────────────────────────────────────────────────────
  - id: M1_cross_session
    description: >
      Fact stored in session A (memory tool write) is retrievable in session B.
      The agent must save the fact, then recall it and report the value.
    user_message: |
      I need you to do two things in order:

      1. Save this fact to your persistent memory using the memory tool:
         "The project Alpha uses port 9090 for its API."

      2. Now, acting as if this is a brand new session where you just loaded
         your memory, tell me: what port does project Alpha use? Report only
         the port number and the project name.
    system_message: >
      You have access to a persistent memory tool. Use it to save durable
      facts. When asked to recall something, check your memory first and
      report what you find. Be precise and factual.
    enabled_toolsets: [terminal, memory]
    skip_memory: false
    skip_context_files: true
    config_overrides:
      agent.max_iterations: 8
    seed_memories:
      target: memory
      entries: []
    expected_recall:
      - fact: "9090"
        must_appear: true
      - fact: "Alpha"
        must_appear: true
    pass_conditions:
      - type: no_tool_error
      - type: response_contains
        value: "9090"
      - type: recall_at_3
        min: 0.85

  # ─────────────────────────────────────────────────────────────────────
  # M2 — Distractor resistance
  # 50 seeded memories (49 distractors + 1 relevant about "project Beta"),
  # all loaded into the frozen snapshot.  The agent must surface the one
  # relevant entry in its top-3 recalled items (i.e., the response mentions
  # the Beta fact).  recall@3 = 1.0 if the relevant fact is in the response.
  # ─────────────────────────────────────────────────────────────────────
  - id: M2_distractor
    description: >
      50 seeded memories, only 1 relevant to the query.  The relevant entry
      must appear in the top-3 recalled items (response references it).
    user_message: |
      I'm working on project Beta. Based on your persistent memory, what do
      you know about project Beta? Report any facts you have stored about it.
    system_message: >
      You have persistent memory loaded in your system prompt. Scan it
      carefully for entries relevant to the user's question. Report only
      what you actually have stored — do not guess or fabricate.
    enabled_toolsets: [terminal, memory]
    skip_memory: false
    skip_context_files: true
    config_overrides:
      agent.max_iterations: 6
    seed_memories:
      target: memory
      entries:
        # ── 49 distractor entries (unrelated to project Beta) ──
        - "The CI pipeline runs on GitHub Actions with Node 20."
        - "User prefers dark mode in all editors."
        - "The staging server is at staging.internal.example.com."
        - "Python 3.12 is the minimum supported version."
        - "Database backups run at 02:00 UTC daily."
        - "The logging level is set to INFO in production."
        - "API rate limit is 1000 requests per minute."
        - "The frontend uses React 18 with TypeScript."
        - "Docker images are published to registry.internal.example.com."
        - "The test suite uses pytest with xdist for parallelism."
        - "Code review requires at least two approvals."
        - "The deploy script is in scripts/deploy.sh."
        - "Environment variables are loaded from .env file."
        - "The cache layer uses Redis 7 with TLS."
        - "Background jobs run on Sidekiq with 4 workers."
        - "The API gateway is nginx with custom rate limiting."
        - "Secrets are stored in AWS Secrets Manager."
        - "The monitoring stack uses Prometheus and Grafana."
        - "Log aggregation goes to Elasticsearch via Fluentd."
        - "The CDN is Cloudflare with edge caching enabled."
        - "SSH key rotation happens every 90 days."
        - "The Kubernetes cluster runs version 1.28."
        - "Service mesh is Istio with mTLS between services."
        - "The email service is SendGrid with dedicated IP."
        - "File uploads go to S3 with lifecycle policies."
        - "The search engine is OpenSearch with 3 nodes."
        - "GraphQL endpoint is at /graphql with persisted queries."
        - "The message queue is RabbitMQ with mirrored queues."
        - "Feature flags are managed by LaunchDarkly."
        - "The analytics pipeline runs on Snowflake."
        - "Mobile push notifications use Firebase Cloud Messaging."
        - "The VPN is WireGuard with per-user keys."
        - "DNS is managed by Route 53 with health checks."
        - "The container registry cleanup policy keeps 30 days."
        - "Static analysis runs on every PR via CodeQL."
        - "The incident channel is #incidents on Slack."
        - "On-call rotation is weekly with a secondary engineer."
        - "The status page is hosted at status.example.com."
        - "The docs site uses MkDocs Material theme."
        - "API documentation is generated from OpenAPI specs."
        - "The changelog follows Keep a Changelog format."
        - "Semantic versioning is enforced by release-please."
        - "The linter is ruff with line length 100."
        - "Type checking uses mypy in strict mode."
        - "The dev container uses Ubuntu 22.04 base."
        - "Integration tests run against a docker-compose stack."
        - "The load balancer is ALB with sticky sessions."
        - "Secret scanning runs on every commit via Gitleaks."
        - "The webhook signing secret is rotated quarterly."
        # ── 1 relevant entry ──
        - "Project Beta uses port 7070 for its gRPC service."
    expected_recall:
      - fact: "7070"
        must_appear: true
      - fact: "Beta"
        must_appear: true
      - fact: "gRPC"
        must_appear: true
        optional: true  # nice-to-have, excluded from recall@3 denominator
    pass_conditions:
      - type: no_tool_error
      - type: recall_at_3
        min: 0.85

  # ─────────────────────────────────────────────────────────────────────
  # M3 — Stale override (newer correction wins)
  # An old fact is seeded, then a newer correction is written via the
  # memory tool's `replace` action.  The agent must report the NEWER value.
  # This tests that the memory tool's replace semantics (substring match +
  # overwrite) produce the correct current state in the snapshot.
  # ─────────────────────────────────────────────────────────────────────
  - id: M3_stale_override
    description: >
      Old fact + newer correction.  The agent must replace the stale entry
      and report the updated value, not the old one.
    user_message: |
      I need you to manage your memory carefully:

      1. First, save this to memory: "The database host is db-old.example.com"

      2. Now, the database has moved. Use the memory tool's replace action to
         update that entry. Replace the entry containing "db-old" with:
         "The database host is now db-new.example.com (updated 2026-06-30)"

      3. Finally, tell me: what is the current database host? Report only
         the hostname. Do not report the old one.
    system_message: >
      You have a persistent memory tool. When a fact changes, use the
      replace action to update the existing entry — do not just add a
      duplicate. When asked to recall, report only the current value.
    enabled_toolsets: [terminal, memory]
    skip_memory: false
    skip_context_files: true
    config_overrides:
      agent.max_iterations: 10
    seed_memories:
      target: memory
      entries: []
    expected_recall:
      - fact: "db-new"
        must_appear: true
      - fact: "db-old"
        must_appear: false  # the OLD value must NOT be reported as current
    pass_conditions:
      - type: no_tool_error
      - type: response_contains
        value: "db-new"
      - type: recall_at_3
        min: 0.85

  # ─────────────────────────────────────────────────────────────────────
  # M4 — Clean HERMES_HOME (no hallucinated recall)
  # A fresh HERMES_HOME with no memory files.  The agent must state it has
  # no prior memory of the queried topic, rather than hallucinating facts.
  # skip_memory: true ensures no snapshot is loaded; the rubric checks that
  # the response acknowledges the absence of memory (honesty check).
  # ─────────────────────────────────────────────────────────────────────
  - id: M4_no_memory_clean
    description: >
      Fresh HERMES_HOME with no seeded memories.  The agent must not
      hallucinate recall — it should state it has no prior memory of the
      queried topic.
    user_message: |
      What do you remember about a project called "Phantom" from previous
      sessions? Do you have any stored memory about it?
    system_message: >
      You have a persistent memory tool. Only report facts you actually have
      stored in memory. If you have no memory of something, say so clearly —
      do not guess or fabricate.
    enabled_toolsets: [terminal, memory]
    skip_memory: true
    skip_context_files: true
    config_overrides:
      agent.max_iterations: 6
    seed_memories:
      target: memory
      entries: []  # explicitly empty — clean state
    expected_recall:
      - fact: "no prior memory"
        must_appear: true
        match_mode: fuzzy  # allow paraphrases like "don't have any memory"
      - fact: "Phantom"
        must_appear: false  # must NOT claim specific Phantom facts
        match_mode: negative_claim
    pass_conditions:
      - type: no_tool_error
      - type: recall_at_3
        min: 0.85